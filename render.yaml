# Blueprint Render : service web construit depuis le Dockerfile de la branche master.
# Les secrets (sync: false) se saisissent dans le dashboard Render, jamais dans ce fichier.
services:
  - type: web
    name: auth-web-app-api
    runtime: docker
    branch: master
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Derrière le proxy de Render : nécessaire pour que la limitation de débit voie la vraie IP.
      - key: TRUST_PROXY
        value: "1"
      - key: EMAIL_PROVIDER
        value: brevo
      - key: LOG_LEVEL
        value: info
      - key: MONGODB_URI
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
